services:
  - type: web
    name: luxe-radar
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m playwright install chromium
    startCommand: gunicorn --config gunicorn.conf.py wsgi:application
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: LUXE_RADAR_ENV
        value: production
      - key: LUXE_RADAR_SECRET_KEY
        generateValue: true
      - key: LUXE_RADAR_TRUST_PROXY
        value: "1"
      - key: LUXE_RADAR_HTTPS
        value: "true"
      - key: LUXE_RADAR_VERBOSE
        value: "false"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: LUXE_RADAR_MULTI_TIMEOUT
        value: "8"
      - key: LUXE_RADAR_SEARCH_RESULT_LIMIT
        value: "500"
      - key: LUXE_RADAR_MAX_CACHED_SEARCHES
        value: "8"
      - key: LUXE_RADAR_PROGRESSIVE_WORKERS
        value: "2"
      - key: LUXE_RADAR_VINTED_TIMEOUT_MS
        value: "6500"
      - key: LUXE_RADAR_VINTED_SETTLE_MS
        value: "250"
      - key: LUXE_RADAR_VINTED_TOTAL_SECONDS
        value: "9"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: LUXE_RADAR_PUBLIC_BASE_URL
        value: https://luxe-radar.onrender.com
