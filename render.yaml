services:
  - type: web
    name: luxe-radar
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m playwright install chromium
    startCommand: gunicorn --config gunicorn.conf.py wsgi:application
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: LUXE_RADAR_ENV
        value: production
      - key: LUXE_RADAR_SECRET_KEY
        generateValue: true
      - key: LUXE_RADAR_TRUST_PROXY
        value: "1"
      - key: LUXE_RADAR_HTTPS
        value: "true"
      - key: LUXE_RADAR_VERBOSE
        value: "false"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: LUXE_RADAR_MULTI_TIMEOUT
        value: "8"
      - key: LUXE_RADAR_SEARCH_RESULT_LIMIT
        value: "2000"
      - key: LUXE_RADAR_MAX_CACHED_SEARCHES
        value: "8"
      - key: LUXE_RADAR_PROGRESSIVE_WORKERS
        value: "2"
      # Sources dont le benchmark prod a prouvé le blocage (403/429/challenge)
      # pour l'egress datacenter : omises des vagues dès le démarrage pour ne
      # pas re-payer la taxe froide à chaque déploiement. Données réelles,
      # pas de contournement : après le cooldown, un nouveau test est tenté.
      - key: LUXE_RADAR_PRESEED_BLOCKED
        value: "Alltricks, Courir, Deporvillage, Ekosport, Footshop, Grailed, JD Sports, Zalando, i-Run"
      - key: LUXE_RADAR_VINTED_TIMEOUT_MS
        value: "6500"
      - key: LUXE_RADAR_VINTED_LAUNCH_MS
        value: "15000"
      - key: LUXE_RADAR_VINTED_SETTLE_MS
        value: "250"
      - key: LUXE_RADAR_VINTED_TOTAL_SECONDS
        value: "9"
      # Collecte profonde à la demande uniquement. Sur le petit worker Render,
      # aucun seed massif au démarrage et aucun connecteur Chromium : le scroll
      # déclenche l'approfondissement HTTP du produit réellement recherché.
      - key: LUXE_RADAR_COLLECTOR_ENABLED
        value: "true"
      - key: LUXE_RADAR_COLLECTOR_STARTUP_SEEDS_ENABLED
        value: "false"
      - key: LUXE_RADAR_COLLECTOR_ALLOWED_SOURCES
        value: "eBay,SSENSE,The Outnet"
      - key: LUXE_RADAR_COLLECTOR_SEED_BUDGET_SECONDS
        value: "120"
      - key: LUXE_RADAR_COLLECTOR_IDLE_SECONDS
        value: "10"
      - key: LUXE_RADAR_COLLECTOR_SEEDS
        value: '[["Nike P-6000",250],["Nike Trail",250],["Nike",250],["On Cloud 5",250],["On Cloudmonster",250],["On",250],["Stone Island",300],["Adidas Samba",200],["New Balance 2002R",250],["Salomon XT-6",250]]'
      - key: LUXE_RADAR_COLLECTOR_FRESHNESS_SECONDS
        value: "21600"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: LUXE_RADAR_PUBLIC_BASE_URL
        value: https://luxe-radar.onrender.com
